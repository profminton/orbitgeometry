[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitgeometry"
version = "0.3.0"
description = "A Python package for defining and visualizing two-body orbits."
authors = [
    { name = "David A. Minton", email = "daminton@purdue.edu" }
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "matplotlib",
    "shapely",
    "swiftest",
    "ipython",
    "jupyterlab",
    "nbconvert",
    "latex"
]

[tool.setuptools.packages.find]
where = ["orbitgeometry"]
